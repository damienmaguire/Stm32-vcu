# This GitHub Action runs the pre-commit defined in the .pre-commit-config.yaml file

name: 📝 Run pre-commit

on:
  push:
    branches: [Vehicle_Testing]
  pull_request:

concurrency:
  group: precommit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1
